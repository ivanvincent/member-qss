<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>QSS Car Wash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============ TOKENS ============ */
:root{
  --font-display:"Archivo", system-ui, sans-serif;
  --font-ui:"Plus Jakarta Sans", system-ui, sans-serif;

  /* accent (tweakable) */
  --accent:#19D3F3;
  --accent-deep:#0BA5C7;
  --accent-ink:#04222b;
  --accent-soft:rgba(25,211,243,.14);

  --r:20px;       /* base radius (tweakable scale via --r-scale) */
  --r-sm:12px;
  --r-lg:28px;
  --r-pill:999px;

  /* MIDNIGHT theme (default) */
  --backdrop:#02080d;
  --bg:#06141F;
  --bg-grad:radial-gradient(120% 80% at 50% -10%, #0c2333 0%, #06141F 55%, #04101a 100%);
  --surface:#0E2233;
  --surface-2:#143047;
  --surface-3:#1b3c56;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --text:#EAF4FA;
  --text-dim:#9DB4C4;
  --text-mute:#62798a;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --chrome:linear-gradient(145deg,#f4f8fb 0%,#cfd9e0 28%,#9fb0bc 52%,#e6edf1 74%,#b6c4ce 100%);
  --chrome-ink:#1b2a36;
}
[data-theme="aqua"]{
  --backdrop:#0a2230;
  --bg:#0a2734;
  --bg-grad:radial-gradient(120% 80% at 50% -10%, #134a5f 0%, #0d3242 55%, #0a2734 100%);
  --surface:#103745;
  --surface-2:#16485a;
  --surface-3:#1d5a6f;
  --line:rgba(255,255,255,.11);
  --line-strong:rgba(255,255,255,.2);
  --text:#F0FBFF;
  --text-dim:#a9cdd9;
  --text-mute:#6f9aa8;
  --shadow:0 18px 50px -20px rgba(0,20,28,.7);
}
[data-theme="noir"]{
  --backdrop:#000000;
  --bg:#0a0c0f;
  --bg-grad:radial-gradient(120% 80% at 50% -10%, #16191e 0%, #0a0c0f 60%, #050608 100%);
  --surface:#131619;
  --surface-2:#1c2024;
  --surface-3:#262b30;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.15);
  --text:#F2F4F6;
  --text-dim:#9aa3ab;
  --text-mute:#5e666d;
  --shadow:0 18px 50px -20px rgba(0,0,0,.85);
  --chrome:linear-gradient(145deg,#eceff2 0%,#aab4bc 30%,#7d8890 52%,#dfe4e8 76%,#9aa6ae 100%);
}

/* radius scale tweak */
[data-radius="sharp"]{ --r:8px; --r-sm:6px; --r-lg:12px; }
[data-radius="rounded"]{ --r:20px; --r-sm:12px; --r-lg:28px; }
[data-radius="pill"]{ --r:28px; --r-sm:18px; --r-lg:36px; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--backdrop);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ============ APP FRAME ============ */
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.app-frame{
  position:relative;
  width:100%;
  max-width:440px;
  height:100vh;
  background:var(--bg);
  background-image:var(--bg-grad);
  color:var(--text);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media (min-width:600px){
  #root{padding:24px;}
  .app-frame{
    height:min(920px,94vh);
    border-radius:46px;
    box-shadow:var(--shadow), 0 0 0 10px #0a1118, 0 0 0 11px rgba(255,255,255,.06);
  }
}
.app-scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:108px;
}
.app-scroll.no-nav{padding-bottom:24px;}

/* utility */
.h-display{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1.02;}
.mono{font-family:var(--font-display);font-feature-settings:"tnum";}
.fade-in{animation:fadeIn .32s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.pop-in{animation:popIn .3s cubic-bezier(.2,.9,.3,1.3) both;}
@keyframes popIn{from{transform:scale(.9);}to{transform:none;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/qrious@4.0.2/dist/qrious.min.js"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="widgets.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
<script type="text/babel" src="qr.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="booking.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
