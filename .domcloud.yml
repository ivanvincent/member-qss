# DOM Cloud deployment — QSS Car Wash (static site, no build step)
source:
  url: https://github.com/ivanvincent/member-qss
  branch: main
  type: github

features:
  - nginx

nginx:
  root: public_html
  index: index.html
  fastcgi: 'off'
  passenger:
    enabled: 'off'
  locations:
    - match: /
      try_files: $uri $uri/ /index.html

commands:
  # Register .jsx as a JavaScript MIME type so Babel can fetch the files
  - |
    if ! grep -q '\.jsx' ~/nginx.d/app.conf 2>/dev/null; then
      echo 'types { application/javascript jsx; }' >> ~/nginx.d/app.conf
    fi
